<script type="text/javascript">
  var questao1 = {
  questao: '<span>1.</span> Qual o significado da palavra aquilombamento',
  alternativas: ['a) Prática de identificar e mudar valores; ', 'b) reservas percentuais de vagas para negros e indígenas; ', 'c) Forma ou tipo de organização dos quilombos. ;'],
  correta: 2
};
var questao2 = {
  questao: '<span>2.</span> A frase a seguir se relaciona com qual das palavras abaixo: "são práticas que partem da crença de que uma raça é superior a outra"',
  alternativas: ['a) Racismo', 'b) Umbamda', 'c) Negritude'],
  correta: 0
};
var questao3 = {
  questao: '<span>3.</span> Qual das palavras abaixo está relacionada a religião afro-brasileiras',
  alternativas: ['a) Catolicismo, Batuque, Marçonaria', 'b) Budismo, Cristianismo, Candomblé', 'c) Candomblé, Batuque, Umbamda'],
  correta: 2
};
var questao4 = {
  questao: '<span>4.</span> O que é "cotas raciais"',
  alternativas: ['a) Preconceito contra o povo afro-brasileiro', 'b) Reservas percentuais de vagas para negros e indígenas. ', 'c) Arte musical de cultura africana'],
  correta: 1
};
var questao5 = {
  questao: '<span>5.</span>O trecho a seguir se relaciona com qual das palavras abaixo: "conceito que se refere às línguas, comportamentos, cultura e características físicas" ',
  alternativas: ['a) Batuque', 'b) Etnia', 'c)Macumba'],
  correta: 1
};
var questao6 = {
  questao: '<span>6.</span> Qual das palavras abaixo se refere a um esporte afro-brasileiro que mistura arte marcial, dança e música',
  alternativas: ['a) Capoeira', 'b) Balé', 'c) Samba'],
  correta: 0
};



 
var questoes = [questao1, questao2, questao3, questao4, questao5, questao6];



var tags;
var tagsClass = '';
var liTagsid = [];
var alternativaCorreta = 0;
var quizPage = 1;
var index = 0;
var questaoAtual = questoes[index];
var questaoAnterior;
var indexAnterior = 0;
var ulTag = document.getElementsByTagName('ul')[0];
var botao = document.getElementById('responder');
var tituloQuestao = document.getElementById('questao');
var selecionada = 'selected';
var contadorQuestoes = 0;
var acertos = 0;

function showQuestions() {
  if (index != 0) {
    // cria o botão de responder nas próximas páginas
    ulTag.innerHTML = '';
    botao.innerHTML = 'Responder';
    botao.className = 'responder btn';
    botao.id = 'responder';
    document.getElementById('numeroQuiz').innerHTML = quizPage;
  }

    tituloQuestao.innerHTML = questaoAtual.questao;

  // gera as alternativas
  for (var i = 0; i < questaoAtual.alternativas.length; i++) {
    var newAlt = document.createElement('li');
    newAlt.id = 'alt' + (i + 1);
    newAlt.className = "notSelected";
    var textAlt = document.createTextNode(questaoAtual.alternativas[i]);
    newAlt.appendChild(textAlt);
    var addNewAltHere = document.getElementById('alternativa');
    addNewAltHere.appendChild(newAlt);
    console.log(questaoAtual.alternativas[i]);
  }
  var $liTags = $('.notSelected').click(function(list) {
    list.preventDefault();
    $liTags.removeClass(selecionada);
    $(this).addClass(selecionada);
    for (var i = 0; i < questaoAtual.alternativas.length; i++) {
      // console.log(liTagsid[i]);
      if ($liTags[i].className == "notSelected selected") {
        //armazena a alternativa
        tags = $liTags[i].id;
        // tagsClass = $LiTags.className;
        console.log(tags);
        tagsClassName = $liTags[i];
      }
    }
  });
  botao.onclick = function() {
    checkAnswer()
  };
}


  showQuestions();

function checkAnswer() {
  var selectedItem = document.getElementById(tags);

  // Caso não tenha escolhido alguma alternativa
  if (selectedItem == undefined) {
    alert("Por favor selecione uma alternativa.")
    return
  } else {
    var userAns = selectedItem.innerHTML;
  }
  // muda o background de acordo com a escolha
  if (userAns == questaoAtual.alternativas[questaoAtual.correta]) {
    console.log("Acertou: " + userAns);
    $('#modalAcertou').modal();
    contadorQuestoes++;
    acertos++;
    document.getElementById("acertos").innerHTML= 'Você acertou: ' + acertos + '/6 questões'

    
    if(contadorQuestoes<6){
      setTimeout(function() {
        $('#modalAcertou').modal('hide');
        criaBtn();
        botao.click();
      }, 2000);
    }
    else{   

      setTimeout(function() {
        $('#modalAcertou').modal('hide');
        $('#pagina-quiz').css("display", "none");
        $('#finish').css("display", "block");
      }, 2000);
    }

    selectedItem.className = 'correta';
    alternativaCorreta++;
  } 
  else{
    $('#modalErrou').modal();    
    setTimeout(function() {
      $('#modalErrou').modal('hide');
    }, 2000);
     contadorQuestoes++;
     if(contadorQuestoes<6){
      setTimeout(function() {
        $('#modalErrou').modal('hide');
        criaBtn();
        botao.click();
      }, 2000);
    }
    else{   

      setTimeout(function() {
        $('#modalErrou').modal('hide');
        $('#pagina-quiz').css("display", "none");
        $('#finish').css("display", "block");
      }, 2000);
    }


  }


  function criaBtn(){
    // Cria o botão para a próxima pergunta após responder certo
    botao.innerHTML = 'Próxima Pergunta';
    botao.className = 'next btn';
    botao.id = 'next';
    questaoAnterior = questaoAtual;
    quizPage++;
    index++;
    questaoAtual = questoes[index];

    botao.onclick = function() {
      showQuestions()
    };
  }
  return
}
